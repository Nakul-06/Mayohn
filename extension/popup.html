<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 16px;
    }
    h3 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 16px;
      color: #3b82f6;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 8px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 8px;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 13px;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .btn {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      font-size: 13px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #1d4ed8;
    }
    .status-panel {
      margin-top: 14px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px;
      font-size: 12px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .status-val {
      font-weight: 600;
    }
    .connected {
      color: #10b981;
    }
    .disconnected {
      color: #ef4444;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .stat-box {
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      padding: 6px;
      text-align: center;
    }
    .stat-lbl {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .stat-val {
      font-size: 14px;
      font-weight: 700;
      color: #10b981;
      margin-top: 2px;
    }
  </style>
  <title>MTurk Agent</title>
</head>
<body>
  <h3>MTurk RDP Agent</h3>
  
  <div class="form-group">
    <label for="rdpName">RDP Identifier</label>
    <input type="text" id="rdpName" placeholder="e.g. RDP-01">
  </div>
  
  <div class="form-group">
    <label for="serverUrl">Dashboard Server URL</label>
    <input type="text" id="serverUrl" placeholder="ws://10.41.156.34:3010">
  </div>
  
  <button class="btn" id="saveBtn">Save & Connect</button>
  
  <div class="status-panel">
    <div class="status-row">
      <span>Dashboard Server:</span>
      <span class="status-val disconnected" id="srv-status">Disconnected</span>
    </div>
    <div class="status-row">
      <span>MTurk Worker ID:</span>
      <span class="status-val" id="worker-id-val">Searching...</span>
    </div>
    
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-lbl">Today's Payout</div>
        <div class="stat-val" id="stat-earn">$0.00</div>
      </div>
      <div class="stat-box">
        <div class="stat-lbl">Queue Count</div>
        <div class="stat-val" id="stat-queue" style="color: #f59e0b;">0</div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
